name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test + self-proof (fail-closed)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm audit --audit-level=high

      - run: npm test

      - name: Install pinned Playwright Chromium
        run: |
          npx playwright install --with-deps chromium
          CHROMIUM="$(find "$HOME/.cache/ms-playwright" -type f -name chrome -print -quit)"
          if [ -z "$CHROMIUM" ]; then
            echo "Chromium binary was not found"
            exit 1
          fi
          chmod +x "$CHROMIUM"
          echo "Found Chromium: $CHROMIUM"
          echo "VISUAL_DIFF_CHROMIUM=$CHROMIUM" >> "$GITHUB_ENV"

      - name: Run self-proof
        run: npm run proof

      - name: Upload self-proof report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: self-proof-report
          path: examples/out/REPORT.html
          if-no-files-found: warn
